[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authguard-ai"
version = "0.1.0"
description = "Defensive AI project for detecting anomalous authentication events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
